# Each entry is a distinct selectable fight or named fight variant.  Ascended
# and Radiant difficulty arenas are intentionally not duplicated here: they are
# difficulty modes of the same fights.  Scene names were verified against this
# machine's Hollow Knight ``globalgamemanagers`` build-scene table.
