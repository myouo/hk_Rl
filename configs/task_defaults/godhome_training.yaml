# Shared Hall of Gods training defaults. Boss identity stays in
# configs/tasks/<boss_id>.yaml; reward/layout changes belong here unless a
# specific fight requires an explicit override.
difficulty: attuned
time_limit_seconds: 180

player:
  hp: max
  soul: 0
  charms: default

reward:
  boss_damage: 1.0
  player_damage: -8.0
  soul_gained: 0.5
  heal_amount: 2.0
  boss_kill: 100.0
  player_death: -100.0
  time_penalty: -0.001
  invalid_action: -0.01

observation:
  max_entities: 64
  include_fsm_state: true
  include_hitbox: true
  tier: privileged

action:
  action_repeat: 2
  enable_macro_actions: true
  n_macro_actions: 11
  expose_action_combinations: true

arena:
  auto_reset_on_terminal: true
  objective: win
