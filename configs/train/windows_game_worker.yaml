# Windows Game PC role. Hollow Knight and policy inference stay on this host.
# Learner/checkpoint endpoints are the local ends of the SSH tunnel.
defaults:
  - ./remote_learner.yaml

transport:
  name: tcp
  host: 127.0.0.1
  port: 5555

learner:
  bind: 127.0.0.1:5600

security:
  bind_scope: localhost
  require_token: true
  auth_token_env: HKRL_AUTH_TOKEN
