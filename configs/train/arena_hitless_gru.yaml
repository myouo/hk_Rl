# Recurrent high-ceiling arena policy. Primitive branches stay factorized;
# semantic combinations are exposed as side metadata, not a new action head.
defaults:
  - ../base.yaml

algorithm: recurrent_ppo
sequence_length: 64
burn_in: 8
entropy_coef: 0.015

model:
  name: entity_attention_gru
  entity_hidden: 128
  attention_layers: 2
  attention_heads: 4
  rnn_type: gru
  rnn_hidden: 256
